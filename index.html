<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ark Passport</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #vswitch { position: fixed; right: 14px; bottom: 14px; z-index: 99999; font-family: ui-monospace, 'Courier New', monospace; }
  #vswitch .panel { display: none; position: absolute; right: 0; bottom: 44px; width: 208px; background: #f4f4f2; color: #1a1a1a; border: 2px solid #1a1a1a; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.45); padding: 10px; }
  #vswitch.open .panel { display: block; }
  #vswitch .panel h2 { margin: 2px 2px 8px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #555; font-weight: 700; }
  #vswitch .ver { display: block; width: 100%; text-align: left; margin: 4px 0; padding: 9px 10px; font: inherit; font-size: 12px; background: #fff; color: #1a1a1a; border: 1.5px solid #9a9a9a; border-radius: 7px; cursor: pointer; }
  #vswitch .ver:hover { border-color: #1a1a1a; }
  #vswitch .ver.active { background: #1a1a1a; color: #f4f4f2; border-color: #1a1a1a; }
  #vswitch .ver .tag { float: right; font-size: 10px; color: inherit; opacity: .65; }
  #vswitch > .pill { padding: 10px 14px; font: inherit; font-size: 11px; letter-spacing: .1em; background: #1a1a1a; color: #f4f4f2; border: 2px solid #f4f4f2; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #vswitch > .pill:hover { background: #333; }
</style>
</head>
<body>
<iframe id="frame" title="Ark Passport" allow="camera; autoplay; fullscreen"></iframe>
<div id="vswitch">
  <div class="panel" role="menu" aria-label="Versions">
    <h2>Ark Passport versions</h2>
    <button class="ver" data-v="v1" role="menuitem">v1 · Original Space <span class="tag">classic</span></button>
    <button class="ver" data-v="v2" role="menuitem">v2 · Western Space <span class="tag">idea by Khaalid</span></button>
  </div>
  <button class="pill" id="pill" aria-haspopup="true" aria-expanded="false">VERSIONS</button>
</div>
<script>
(function () {
  var DIRS = { v1: 'v1/', v2: 'v2/' };
  var DEFAULT = 'v2';
  var frame = document.getElementById('frame');
  var sw = document.getElementById('vswitch');
  var pill = document.getElementById('pill');
  var buttons = Array.prototype.slice.call(sw.querySelectorAll('.ver'));

  function pick() {
    var q = new URLSearchParams(location.search).get('v');
    if (q && DIRS['v' + q]) return 'v' + q;
    if (q && DIRS[q]) return q;
    try {
      var saved = localStorage.getItem('ark-version');
      if (saved && DIRS[saved]) return saved;
    } catch (e) {}
    return DEFAULT;
  }

  function setVersion(id) {
    if (!DIRS[id]) return;
    frame.src = DIRS[id];
    buttons.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-v') === id); });
    try { localStorage.setItem('ark-version', id); } catch (e) {}
  }

  pill.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = sw.classList.toggle('open');
    pill.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function (e) {
    if (!sw.contains(e.target)) sw.classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') sw.classList.remove('open');
  });
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      setVersion(b.getAttribute('data-v'));
      sw.classList.remove('open');
    });
  });

  setVersion(pick());
})();
</script>
</body>
</html>
