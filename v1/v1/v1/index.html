<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ark Passport</title>
  <meta name="description" content="Get your ENCY intergalactic passport. Snap a selfie, get stamped, post the story." />
  <meta name="theme-color" content="#12031f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Unbounded:wght@600;900&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="stage-wrap">
      <canvas id="stage" width="1080" height="1920" aria-label="Your animated passport story"></canvas>
      <div class="badge" id="badge" hidden><span class="dot"></span><span id="badgeText">RENDERING</span></div>
    </div>

    <aside class="panel">
      <header class="brand">
        <h1>Ark Passport <span class="spark">✦</span></h1>
        <p class="sub">Get your papers, space babe.</p>
      </header>

      <section class="block">
        <h2>Photo</h2>
        <div class="row">
          <button class="btn primary" id="selfieBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            Take selfie
          </button>
          <label class="btn" id="uploadBtn">
            <input type="file" id="photoInput" accept="image/*" hidden />
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
            Upload
          </label>
          <input type="file" id="selfieInput" accept="image/*" capture="user" hidden />
        </div>
        <div class="seg" role="radiogroup" aria-label="Photo style">
          <button class="seg-btn active" data-style="natural" role="radio" aria-checked="true">Natural</button>
          <button class="seg-btn" data-style="dreamy" role="radio" aria-checked="false">Dreamy</button>
          <button class="seg-btn" data-style="duotone" role="radio" aria-checked="false">Duotone</button>
        </div>
        <label class="slider-row">
          <span>Zoom</span>
          <input type="range" id="zoom" min="100" max="300" value="100" />
        </label>
        <p class="hint">Drag your photo on the passport to line it up.</p>
      </section>

      <section class="block">
        <div class="row-head">
          <h2>Details</h2>
          <button class="link-btn" id="surpriseBtn">✦ Surprise me</button>
        </div>
        <div class="grid2">
          <label class="field"><span>First name</span><input id="fFirst" maxlength="18" autocomplete="given-name" placeholder="Luna" /></label>
          <label class="field"><span>Last name</span><input id="fLast" maxlength="18" autocomplete="family-name" placeholder="Stardust" /></label>
        </div>
        <label class="field"><span>Callsign</span><input id="fCall" maxlength="18" placeholder="Glitterbomb" /></label>
        <label class="field"><span>Rank</span><select id="fRank"></select></label>
        <label class="field"><span>Home planet</span><input id="fPlanet" maxlength="20" list="planetList" placeholder="Club Andromeda" /></label>
        <datalist id="planetList"></datalist>
      </section>

      <section class="block">
        <div class="row-head">
          <h2>Vibe</h2>
          <span class="meta" id="themeName">Bubblegum</span>
        </div>
        <div class="themes" id="themes" role="radiogroup" aria-label="Color theme"></div>
      </section>

      <section class="block">
        <h2>Track</h2>
        <div class="row">
          <button class="btn icon" id="playBtn" aria-label="Play">
            <svg viewBox="0 0 24 24" width="18" height="18"><path id="playPath" d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
          </button>
          <div class="seg seg-2 grow" role="radiogroup" aria-label="Track">
            <button class="seg-btn track-btn active" data-track="crystals" role="radio" aria-checked="true">Crystals</button>
            <button class="seg-btn track-btn" data-track="cyclones" role="radio" aria-checked="false">Cyclones</button>
          </div>
        </div>
      </section>

      <section class="block">
        <div class="row-head">
          <h2>Export</h2>
          <span class="meta">story · 1080 × 1920</span>
        </div>
        <div class="row">
          <select id="lenSelect" aria-label="Video length">
            <option value="10">10 sec</option>
            <option value="15" selected>15 sec</option>
            <option value="30">30 sec</option>
          </select>
          <button class="btn primary grow" id="exportBtn">Export video</button>
        </div>
        <div class="row">
          <button class="btn grow" id="stillBtn">Save image</button>
          <button class="btn grow" id="shareBtn" hidden>Share</button>
          <a class="btn grow" id="downloadLink" hidden>Download again</a>
        </div>
        <p class="note" id="exportNote">Video comes with the song baked in.</p>
      </section>
    </aside>
  </main>

  <dialog id="camDialog" class="cam">
    <div class="cam-inner">
      <video id="camVideo" playsinline muted autoplay></video>
      <div class="cam-ring"></div>
      <div class="cam-actions">
        <button class="btn" id="camCancel">Cancel</button>
        <button class="shutter" id="camShoot" aria-label="Take photo"></button>
        <span class="cam-spacer"></span>
      </div>
      <p class="cam-err" id="camErr" hidden></p>
    </div>
  </dialog>

  <script src="../lib/mp4-muxer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
